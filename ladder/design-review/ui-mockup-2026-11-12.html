<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seldon run page - design mockup 2026-11-12</title>
<style>
/* Seldon run page. Read-only. One file, no dependencies.
   Mockup chrome (.mk-*) is NOT part of the product: it fakes the provider app, the chat and time. */
:root{
  --bg:#0b0d10;--s1:#11141a;--s2:#181c24;--line:#242a34;--ink:#e9ebee;--dim:#9aa3af;--faint:#5f6876;
  --live:#5eead4;--you:#fbbf24;--bad:#f87171;--ok:#7fd69b;--rw:#fb923c;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f7f7f4;--s1:#ffffff;--s2:#f0f0ec;--line:#e2e2dc;--ink:#15181d;--dim:#59626e;--faint:#9099a5;
  --live:#0d9488;--you:#b45309;--bad:#dc2626;--ok:#15803d;--rw:#c2410c}}
:root[data-theme=light]{
  --bg:#f7f7f4;--s1:#ffffff;--s2:#f0f0ec;--line:#e2e2dc;--ink:#15181d;--dim:#59626e;--faint:#9099a5;
  --live:#0d9488;--you:#b45309;--bad:#dc2626;--ok:#15803d;--rw:#c2410c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#050608;color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}

/* ---------- mockup chrome ---------- */
.mk-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 12px;background:#000;color:#aab;
  font:11px var(--mono);border-bottom:1px solid #222}
.mk-bar b{color:#fff;font-weight:600}
.mk-bar button{border:1px solid #333;border-radius:4px;padding:2px 8px;color:#ccd}
.mk-bar button.on{background:#ccd;color:#000;border-color:#ccd}
.mk-bar input[type=range]{width:180px;accent-color:#5eead4}
.mk-stage{display:grid;grid-template-columns:1fr 440px;height:calc(100% - 34px);min-height:0}
.mk-stage.full{grid-template-columns:1fr}
.mk-stage.full .mk-chat{display:none}
.mk-chat{background:#0a0a0c;color:#c9d1d9;overflow:auto;padding:14px 18px;border-right:1px solid #222;min-width:0}
.mk-chat h4{font:600 11px var(--mono);letter-spacing:.08em;color:#778;margin:0 0 8px;text-transform:uppercase}
.mk-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.mk-tabs button{font:11px var(--mono);border:1px solid #2a2d35;border-radius:4px;padding:3px 8px;color:#99a}
.mk-tabs button.on{color:#000;background:#5eead4;border-color:#5eead4}
.mk-term{font:12.5px/1.5 var(--mono);white-space:pre;overflow-x:auto;background:#0f1114;border:1px solid #23262d;
  border-radius:8px;padding:14px 16px;color:#d5dae2}
.mk-term .u{color:#8b949e}.mk-term .k{color:#5eead4}.mk-term .y{color:#fbbf24}.mk-term .d{color:#7d8590}
.mk-term a{color:#79c0ff;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.mk-note{font:12px/1.5 var(--sans);color:#8b93a0;max-width:74ch;margin:12px 2px}
.mk-note b{color:#c9d1d9}
.mk-pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.mk-url{font:11px var(--mono);color:var(--faint);background:var(--s2);padding:5px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){.mk-stage{grid-template-columns:1fr}.mk-chat{display:none}
  .mk-stage.chat .mk-chat{display:block}.mk-stage.chat .mk-pane{display:none}}

/* ---------- the page ---------- */
.page{flex:1;min-height:0;overflow:auto;container-type:inline-size;background:var(--bg);color:var(--ink);scroll-behavior:smooth}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.lbl{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.c-live{color:var(--live)}.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-rw{color:var(--rw)}.c-you{color:var(--you)}.c-dim{color:var(--faint)}

.hd{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 16px 0}
.hd-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark{font:700 11px var(--mono);letter-spacing:.14em;color:var(--live)}
.dream{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font:11px var(--mono);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--dim);white-space:nowrap}
.sp{flex:1}
.livedot{font:11px var(--mono);color:var(--dim);white-space:nowrap}
.livedot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:5px;animation:pulse 2s infinite}
.livedot.stale i{background:var(--bad);animation:none}
@keyframes pulse{50%{opacity:.25}}
.ico{border:1px solid var(--line);border-radius:5px;width:22px;height:22px;line-height:18px;text-align:center;color:var(--dim);align-self:center}
.ico:hover{color:var(--ink);border-color:var(--dim)}
.under{color:var(--dim);margin:2px 0 8px;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rail{display:flex;gap:3px;margin:0 0 8px}
.rail div{flex:1;min-width:0}
.rail i{display:block;height:3px;border-radius:2px;background:var(--line)}
.rail .past i{background:var(--dim)}.rail .cur i{background:var(--live)}.rail .cur.you i{background:var(--you)}
.rail span{display:block;font:9px var(--mono);letter-spacing:.04em;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.rail .cur span{color:var(--ink)}.rail .gate span{font-weight:700}
.nowline{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.state{font:600 13px var(--mono);color:var(--live)}
.state.you{color:var(--you)}
.elapsed{font:13px var(--mono);font-variant-numeric:tabular-nums}
.nextwhy{display:grid;grid-template-columns:38px 1fr;gap:1px 6px;margin:6px 0 10px;font-size:12.5px}
.nextwhy b{font:600 10px/1.9 var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.youband{margin:0 -16px;padding:7px 16px;background:color-mix(in srgb,var(--you) 14%,transparent);color:var(--you);
  border-top:1px solid color-mix(in srgb,var(--you) 35%,transparent);font-size:12.5px}
.youband b{font-weight:600}
.tabs{display:flex;gap:16px;margin:0 -16px;padding:0 16px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.tabs a{font:12px var(--sans);color:var(--dim);text-decoration:none;padding:7px 0;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a b{font:600 10px var(--mono);color:var(--you);margin-left:3px}

main{padding:4px 16px 40px}
section{padding-top:18px;scroll-margin-top:190px}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:8px}
.sh h2{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0}
.sh .n{font:11px var(--mono);color:var(--faint)}
.seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:11px var(--mono);padding:2px 9px;color:var(--dim)}
.seg button.on{background:var(--s2);color:var(--ink)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:8px}
.empty{color:var(--faint);font-size:12px;padding:6px 0}

/* since strip */
.since{border-left:2px solid var(--you);padding:2px 0 2px 10px;margin-top:14px}
.since summary{cursor:pointer;list-style:none;font-size:12.5px}
.since summary::-webkit-details-marker{display:none}
.since ol{list-style:none;margin:6px 0 0;padding:0}
.ev{display:grid;grid-template-columns:44px 14px 1fr;gap:6px;font-size:12px;padding:1.5px 0}
.ev time{font:11px/1.6 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}

/* beads */
.bead{padding:10px 12px;margin-bottom:6px;cursor:pointer;display:block;width:100%;text-align:left}
.bead:hover,.bead.sel{border-color:var(--dim)}
.bead-h{display:flex;gap:8px;align-items:baseline}
.uid{font:600 12px var(--mono)}
.ut{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font:600 11px var(--mono);white-space:nowrap}
.tm{font:11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.bead p{margin:4px 0 0;font-size:12.5px}
.bead .w{color:var(--dim)}
.bead .meta{font:11px var(--mono);color:var(--faint);margin-top:5px}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:14px;height:3px;border-radius:2px;background:var(--line)}
.pips i.f{background:var(--ok)}.pips i.c{background:var(--live);animation:pulse 1.6s infinite}.pips i.x{background:var(--rw)}
.qrow{display:grid;grid-template-columns:14px 46px minmax(0,1fr) auto;gap:6px;padding:3px 2px;font-size:12.5px;cursor:pointer;width:100%;text-align:left}
.qrow:hover{background:var(--s2)}
.qrow .r{color:var(--dim)}

/* waves */
.wave{padding:10px 12px;margin-bottom:6px}
.wave.cur{border-color:color-mix(in srgb,var(--live) 55%,var(--line))}
.wave.out{border-style:dashed;background:none}
.wave-h{display:flex;gap:8px;align-items:baseline}
.wn{font:700 12px var(--mono)}
.chip.now{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,var(--line));align-self:center;font-size:10px}
.wg{font-weight:600}
.wstat{margin-left:auto;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.wgoal{color:var(--dim);font-size:12.5px;margin:2px 0 6px}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0 2px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.dots i.live{background:var(--live)}.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.rw{background:var(--rw)}
.wsteps{display:flex;gap:4px;flex-wrap:wrap;font:10px var(--mono);letter-spacing:.04em;color:var(--faint);margin:6px 0}
.wsteps span.p{color:var(--dim)}.wsteps span.c{color:var(--live);font-weight:700}
.urow{display:grid;grid-template-columns:14px 46px minmax(0,1fr) auto auto;gap:6px;align-items:baseline;padding:4px 2px;
  border-top:1px solid var(--line);font-size:12.5px;cursor:pointer;width:100%;text-align:left}
.urow:hover,.urow.sel{background:var(--s2)}
.urow .rs{grid-column:3/-1;color:var(--dim);font-size:12px;margin-top:-2px}
.wnext{font-size:12px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}

/* board */
.kcount{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.kcount button{font:10px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--dim);white-space:nowrap}
.kcount button b{color:var(--ink)}
.lanes{display:grid;gap:6px;margin-bottom:8px}
.lane{border:1px solid color-mix(in srgb,var(--rw) 45%,var(--line));border-radius:8px;padding:8px;min-width:0}
.lane.ec{border-color:var(--line);padding:4px 8px}.lane.ec .col-h{margin:0;color:var(--faint)}
.lane-row{display:flex;gap:6px;overflow-x:auto}
.lane-row .kc{flex:0 0 220px;margin:0}
.lane-d{font-size:11px;margin-top:5px}
.board{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.col{flex:0 0 210px;scroll-snap-align:start;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:90px}
.col.ec{flex:0 0 30px;padding:8px 0}
.col.ec .col-h{writing-mode:vertical-rl;margin:0 auto;gap:8px;justify-content:flex-start;color:var(--faint)}
.col.ec .who{display:none}
.col-h{display:flex;justify-content:space-between;font:600 10px var(--mono);letter-spacing:.08em;color:var(--dim);margin-bottom:6px}
.who{font:10px var(--mono);color:var(--faint);margin:-4px 0 6px}
.kc{display:block;width:100%;min-width:180px;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;margin-bottom:5px;cursor:pointer}
.kc:hover,.kc.sel{border-color:var(--dim)}
.kc.kq{background:none;border-style:dashed}
.kc-h{display:flex;justify-content:space-between;gap:6px}
.kc .ut{display:block;white-space:normal;font-size:12.5px;margin:1px 0 4px}
.kc .r{font-size:11.5px;color:var(--dim);margin-bottom:4px}
.kc .kw{font:10.5px var(--mono);color:var(--faint);margin-bottom:4px}
.bdg{display:inline-block;font:10px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dim);margin:0 3px 2px 0}
.bdg.pv{color:var(--live);border-color:color-mix(in srgb,var(--live) 40%,var(--line))}
.bdg.stl{color:var(--rw);border-color:color-mix(in srgb,var(--rw) 45%,var(--line))}
.wu summary{cursor:pointer;list-style:none;font:11px var(--mono);color:var(--faint);padding:2px 0}
.wu summary::-webkit-details-marker{display:none}

/* timeline */
.tl{padding:10px 12px}
.tl-row{display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:center;height:18px}
.tl-row .uid{font-weight:400;color:var(--dim);font-size:11px}
.track{position:relative;height:8px;background:var(--s2);border-radius:2px}
.track b{position:absolute;top:0;bottom:0;border-radius:1px}
.track.run{height:14px;background:none}
.track.run b{top:5px;bottom:5px;background:var(--line)}
.track.run b.g{top:1px;bottom:1px;width:8px!important;margin-left:-4px;background:var(--you);transform:rotate(45deg) scale(.8);border-radius:1px}
.track em{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ok)}
.b-WAITING,.b-READY{background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 5px)}
.b-WORKING{background:var(--live)}.b-PROVING{background:color-mix(in srgb,var(--live) 60%,var(--bg))}
.b-JUDGING{background:color-mix(in srgb,var(--live) 35%,var(--bg))}.b-INTEGRATING{background:var(--ok)}
.b-DONE{background:color-mix(in srgb,var(--ok) 22%,transparent)}.b-REWORK{background:var(--rw)}.b-FAILED,.b-BLOCKED{background:var(--bad)}
.tl-ax{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--faint);margin:4px 0 0 54px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font:10px var(--mono);color:var(--faint);margin-top:8px}
.legend i{display:inline-block;width:10px;height:6px;border-radius:1px;margin-right:4px}

/* inspector + trace */
.insp{padding:10px 12px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:46px 1fr;gap:2px 8px;font-size:12.5px;margin-top:6px}
.kv b{font:600 10px/1.9 var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.walk{font:11px var(--mono);color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.8}
.walk b{color:var(--ink);font-weight:600}
.tree details{border-left:1px solid var(--line);margin-left:5px;padding-left:10px}
.tree>details{border:1px solid var(--line);border-radius:8px;background:var(--s1);margin:0 0 6px;padding:8px 10px}
.tree summary{cursor:pointer;list-style:none;padding:3px 0;display:flex;gap:6px;align-items:baseline}
.tree summary::-webkit-details-marker{display:none}
.tree summary .k{font:600 9px var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase;flex:0 0 28px}
.tree summary .t{flex:1;min-width:0}
.tree .leaf{padding:2px 0 2px 16px;font:11.5px var(--mono);color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.tree .hit>summary .t{color:var(--live)}
.es{font:600 10px var(--mono);letter-spacing:.04em;white-space:nowrap}

/* evidence */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.shot{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--s1);cursor:zoom-in}
.shot img{display:block;width:100%;height:96px;object-fit:cover;object-position:top}
.shot figcaption{font-size:11.5px;padding:5px 7px;color:var(--dim)}
.shot figcaption b{display:block;color:var(--ink);font-weight:600}
.runs{width:100%;border-collapse:collapse;font:11.5px var(--mono);margin-top:4px}
.runs td{padding:3px 6px 3px 0;border-top:1px solid var(--line);white-space:nowrap;color:var(--dim)}
.runs td:last-child{white-space:normal}
.verd{padding:8px 10px;margin-bottom:6px;font-size:12.5px}
.verd .why{color:var(--dim);margin-top:3px}
.sub{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.lightbox.on{display:flex}.lightbox img{max-width:94%;max-height:92%;border:1px solid #333}

/* plan */
.vision{padding:10px 12px;font-size:12.5px}
.vision ul{margin:4px 0 8px;padding-left:16px}
.q{display:grid;grid-template-columns:16px 1fr auto;gap:6px;padding:4px 0;border-top:1px solid var(--line);font-size:12.5px}
.con{padding:8px 10px;margin-bottom:6px;font-size:12.5px}
.con .flow{font:11px var(--mono);color:var(--dim);margin-top:3px}
.dec{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
.dec time{font:11px/1.7 var(--mono);color:var(--faint)}
.dec .why{color:var(--dim)}
.open{padding:8px 10px;margin-bottom:6px;font-size:12.5px;border-left:2px solid var(--you)}
.open .why{color:var(--dim)}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--faint);line-height:1.8}
.foot b{color:var(--dim);font-weight:400}

/* full screen: the same page, three reading columns */
@container (min-width:980px){
  .hd{padding:14px 28px 0}.tabs,.youband{margin:0 -28px;padding-left:28px;padding-right:28px}
  .hd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:end}
  .dream{font-size:20px}
  main{display:grid;grid-template-columns:340px minmax(0,1fr) minmax(0,1fr);gap:0 28px;padding:4px 28px 60px;align-items:start}
  #now,#open{grid-column:1}#waves{grid-column:2/4;grid-row:1}#trace{grid-column:2}#evidence{grid-column:3}
  #plan{grid-column:2/4}#open{grid-row:2}.foot{grid-column:1/-1}
  #plan .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 24px;align-items:start}
  .col{flex:1 1 0;min-width:150px}.col.ec{flex:0 0 30px;min-width:0}.kc{min-width:0}
  .lanes{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.lane-row{flex-wrap:wrap}.lane-row .kc{flex:1 1 200px}
  section{scroll-margin-top:170px}
}
</style>
</head>
<body>
<div class="mk-bar">
  <b>MOCKUP</b>
  <span>sample <button data-ds="foundation" class="on">Foundation (real run 59d3a56-c02)</button>
  <button data-ds="shelflife">ShelfLife (illustrative large dream)</button></span>
  <span>replay <button id="mkPlay">play</button> <input id="mkT" type="range" min="0" max="100" value="0"> <span id="mkTl"></span></span>
  <span><button id="mkFull">full screen</button> <button id="mkChat">chat text</button> <button id="mkTheme">light/dark</button></span>
</div>
<div class="mk-stage" id="stage">
  <div class="mk-chat">
    <h4>Provider app chat (Codex / Claude Code / Copilot): where everything is decided</h4>
    <div class="mk-tabs" id="chatTabs"></div>
    <div class="mk-term" id="term"></div>
    <div class="mk-note" id="chatNote"></div>
  </div>
  <div class="mk-pane">
    <div class="mk-url" id="url">127.0.0.1:4173/</div>
    <div class="page" id="page"></div>
  </div>
</div>
<div class="lightbox" id="lb"><img alt=""></div>

<script>
/* ============================================================
   SAMPLE DATA. Shape = the proposed projection file (state.js) that Seldon's loop writes

 const bead=x=>`<button class="card bead ${SEL===x.u.id?'sel':''}" data-u="${x.u.id}"><div class="bead-h"><span class="${CLS(x.state)}">${G[x.state]}</span><span class="uid">${x.u.id}</span><span class="ut">${x.u.title}</span><span class="sp"></span><span class="st ${CLS(x.state)}">${x.state}</span><span class="tm">${fmt(T-x.since)}</span></div>
  <p>${x.reason||DOING[x.state]}</p><p class="w">${x.u.reqs.length?'For '+x.u.reqs.map(r=>req(r).title.toLowerCase()).join('; ')+'.':'Writes the try-it guide for the integrated product.'}${x.last?` Last: ${x.last[2]} (${fmt(x.last[0])}).`:''}</p>
  <div class="meta">${pips(x)} &nbsp;${x.u.worker} · ${DS.run.providers}${x.att>1?' · attempt '+x.att:''} · ${x.u.area} · W${wNo(x.u)}</div></button>`;
 return `<section id="now">
  ${since.length?`<details class="since" ${since.length<5?'open':''}><summary><b>${since.length} change${since.length>1?'s':''}</b> <span class="dim">since you last looked (${fmt(LASTSEEN)})</span> <button class="chip" id="seen">seen</button></summary><ol>${since.slice(-8).map(evRow).join('')}</ol></details>`:''}
  <div class="sh" style="margin-top:14px"><h2>Active beads</h2><span class="n">${act.length} running · ${q.length} queued${att.length?` · <span class="c-rw">${att.length} need a look</span>`:''}</span></div>
  ${att.map(bead).join('')}${act.map(bead).join('')}
  ${!act.length&&!att.length?`<div class="empty">${v.units.length?(v.run[5]?'Nothing is running: the run waits for your answer in chat.':'No worker is running. '+v.run[4]+'.'):'No units yet. They appear when the plan is approved at Gate B.'}</div>`:''}
  ${q.length?`<div class="lbl" style="margin:10px 0 2px">Queued, and why</div>${q.map(x=>`<button class="qrow" data-u="${x.u.id}"><span class="c-dim">${G[x.state]}</span><span class="uid">${x.u.id}</span><span>${x.u.title} <span class="r">· ${x.reason||'ready, waiting for a worker slot'}</span></span><span class="tm" title="time queued">${fmt(T-inState(x))}</span></button>`).join('')}`:''}
 </section>`}
const WST={planned:'c-dim',outlined:'c-dim',running:'c-live',verifying:'c-live','flow review':'c-live','check-in':'c-you',done:'c-ok'};
const urow=x=>`<button class="urow ${SEL===x.u.id?'sel':''}" data-u="${x.u.id}"><span class="${CLS(x.state)}">${G[x.state]}</span><span class="uid">${x.u.id}</span><span class="ut" style="font-weight:400">${x.u.title}</span><span class="st ${CLS(x.state)}">${x.state}</span><span class="tm">${x.state==='DONE'?x.u.commit:fmt(T-inState(x))}</span>${x.reason?`<span class="rs">${x.reason}</span>`:''}</button>`;
function wavesView(v){if(!v.waves.length)return `<div class="empty">Waves are outlined at ARCHITECT and shown here from Gate B.</div>`;
 const STEPS=['EXECUTE','WAVE-VERIFY','FLOW REVIEW','STEER','CHECK-IN'],map={running:0,verifying:1,'flow review':2,'check-in':4};
 return v.waves.map(x=>{const cur=x===v.cur&&x.st!=='done'||(x===v.cur&&v.waves.length===1);const dn=x.units.filter(u=>u.state==='DONE').length;
  const si=v.run[0]==='STEER'?3:map[x.st];const att=x.units.filter(u=>ATTN.includes(u.state));const live=x===v.cur&&!['done','outlined'].includes(x.st);
  return `<div class="card wave ${x===v.cur?'cur':''} ${x.w.outline?'out':''}"><div class="wave-h"><span class="wn">W${DS.waves.indexOf(x.w)+1}</span><span class="wg">${x.w.name.split(' · ')[1]||x.w.name}</span>${live?'<span class="chip now">now</span>':''}<span class="wstat ${WST[x.st]}">${x.st}</span></div>
  <div class="wgoal">${x.w.goal}</div>
  ${x.w.outline?`<div class="faint" style="font-size:12px">Units are written when this wave is detailed, from the product as it exists then.</div>`:`
  <div class="dots">${x.units.map(u=>`<i class="${DOT(u.state)}" title="${u.u.id} ${u.state}"></i>`).join('')}<span class="tm" style="margin-left:6px">${dn}/${x.units.length||'?'} integrated${x.st!=='planned'?' · '+fmt(T-(x.w.segs.find(s=>s[0]==='running')||[0,T])[1])+' in wave':''}${att.length?` · <span class="c-rw">${att.map(u=>u.u.id+' '+u.state.toLowerCase()).join(', ')}</span>`:''}</span></div>
  ${cur&&si!=null?`<div class="wsteps">${STEPS.map((s,i)=>`<span class="${i<si?'p':i===si?'c':''}">${i?'→ ':''}${s}</span>`).join(' ')}</div>`:''}
  ${cur?x.units.map(urow).join(''):x.units.length?`<details class="wu" ${SEL&&x.units.some(u=>u.u.id===SEL)?'open':''}><summary>▸ ${x.units.length} units</summary>${x.units.map(urow).join('')}</details>`:''}
  ${cur&&x.w.next?`<div class="wnext"><span class="lbl">After this</span> ${x.w.next}</div>`:''}`}
  </div>`}).join('')}
/* kanban: one column per BLUEPRINT 3 unit state, in flow order; REWORK / FAILED / BLOCKED are lanes above it, because they need a look first.
   WAITING is shown inside READY as a dashed card with its reason (queued, not yet ready). Empty columns fold to a thin rail. */
const KCOLS=[['READY',QUEUED,'code: deps in, contracts there, scope free'],['WORKING',['WORKING'],'one worker session'],['PROVING',['PROVING'],'code: fails on base, passes on patch'],
 ['JUDGING',['JUDGING'],'LLM judge, this unit only'],['INTEGRATING',['INTEGRATING'],'code: merge, rerun affected checks'],['DONE',['DONE'],'integrated, newest first']];
const KLANES=[['REWORK','Back with its own worker, exact failure attached. Two recoveries.'],['FAILED','Recoveries spent; unit steering by the planner.'],['BLOCKED','Stopped on something it cannot settle alone.']];
function kcard(x){const q=QUEUED.includes(x.state),run=ACTIVE.includes(x.state)||ATTN.includes(x.state);
 const stale=c=>{const k=DS.contracts.find(z=>z.id===c);return k&&k.stale&&k.stale<=T};
 const bd=(c,pv)=>`<span class="bdg ${pv?'pv':''} ${stale(c)?'stl':''}" title="${pv?'provides':'consumes'} contract ${c}${stale(c)?' (being corrected)':''}">${pv?'▲':'▽'}${c}</span>`;
 return `<button class="kc ${SEL===x.u.id?'sel':''} ${q?'kq':''}" data-u="${x.u.id}"><span class="kc-h"><span class="uid ${CLS(x.state)}">${G[x.state]} ${x.u.id}</span><span class="tm">${x.state==='DONE'?x.u.commit:fmt(T-inState(x))}</span></span><span class="ut">${x.u.title}</span>
  ${x.reason?`<div class="r">${x.reason}</div>`:q?'<div class="r">ready, waiting for a worker slot</div>':''}${run?`<div class="kw">${x.u.worker}${x.att>1?' · attempt '+x.att:''}</div>`:''}
  <span class="bdg">${x.u.area}</span><span class="bdg">W${wNo(x.u)}</span>${x.u.provides.map(c=>bd(c,1)).join('')}${x.u.consumes.map(c=>bd(c,0)).join('')}</button>`}
function boardView(v){if(!v.units.length)return `<div class="empty">The board fills when the plan is approved at Gate B.</div>`;
 const by=s=>v.units.filter(x=>s.includes(x.state));const attn=by(ATTN).length;
 const lanes=attn?`<div class="lanes">${KLANES.map(([n,d])=>{const xs=by([n]);return `<div class="lane ${xs.length?'':'ec'}" title="${d}"><div class="col-h"><span class="${xs.length?CLS(n):''}">${G[n]} ${n}</span><span>${xs.length||'none'}</span></div>${xs.length?`<div class="lane-row">${xs.map(kcard).join('')}</div><div class="faint lane-d">${d}</div>`:''}</div>`}).join('')}</div>`
  :`<div class="empty">No unit is in rework, failed or blocked.</div>`;
 return `<div class="kcount">${KCOLS.map(([n,s],i)=>`<button data-col="${i}">${n} <b>${by(s).length}</b></button>`).join('')}</div>${lanes}
  <div class="board">${KCOLS.map(([n,s,who])=>{const xs=by(s);if(n==='DONE')xs.sort((a,b)=>b.since-a.since);
   return `<div class="col ${xs.length?'':'ec'}" title="${n}: ${who}"><div class="col-h"><span>${n}</span><span>${xs.length}</span></div><div class="who">${who}</div>${xs.slice(0,8).map(kcard).join('')}${xs.length>8?`<div class="faint" style="font-size:11px">+${xs.length-8} older</div>`:''}</div>`}).join('')}</div>`}
function timelineView(v){const end=Math.max(T,60),pc=t=>(Math.min(t,end)/end*100).toFixed(2)+'%';
 const bars=segs=>segs.filter(s=>s[1]<=T).map((s,i,a)=>{const to=a[i+1]?a[i+1][1]:T;return `<b class="b-${s[0]}" style="left:${pc(s[1])};width:${((to-s[1])/end*100).toFixed(2)}%" title="${s[0]} ${fmt(s[1])}"></b>`}).join('');
 const gates=DS.segs.filter(s=>s[5]&&s[1]<=T).map(s=>`<b class="g" style="left:${pc(s[1])}" title="${s[0]} ${fmt(s[1])}"></b>`).join('');
 const phases=DS.segs.filter(s=>s[1]<=T).map((s,i,a)=>{const to=a[i+1]?a[i+1][1]:T;return `<b style="left:${pc(s[1])};width:calc(${((to-s[1])/end*100).toFixed(2)}% - 1px)" title="${s[0]} ${fmt(s[1])}"></b>`}).join('');
 return `<div class="card tl"><div class="tl-row"><span class="uid">run</span><div class="track run">${phases}${gates}</div></div>
  ${v.units.map(x=>`<div class="tl-row"><span class="uid">${x.u.id}</span><div class="track">${bars(x.u.segs)}${x.u.segs.filter(s=>s[0]==='DONE'&&s[1]<=T).map(s=>`<em style="left:${pc(s[1])}" title="integrated ${fmt(s[1])}"></em>`).join('')}</div></div>`).join('')}
  <div class="tl-ax"><span>0:00</span><span>${fmt(end/2)}</span><span>${fmt(end)} now</span></div>
  <div class="legend"><span><i style="background:var(--you)"></i>your gates</span><span><i class="b-WAITING"></i>waiting</span><span><i class="b-WORKING"></i>working</span><span><i class="b-PROVING"></i>proving</span><span><i class="b-JUDGING"></i>judging</span><span><i class="b-INTEGRATING"></i>integrated</span><span><i class="b-REWORK"></i>rework</span><span><i class="b-BLOCKED"></i>blocked</span></div></div>
  <ol style="list-style:none;padding:0;margin:8px 0 0">${v.events.slice(-6).reverse().map(evRow).join('')}</ol>`}
function waves(v){return `<section id="waves"><div class="sh"><h2>Waves</h2><span class="n">${v.cur?'wave '+(DS.waves.indexOf(v.cur.w)+1)+' of '+DS.waves.length+' · ':''}${v.units.filter(x=>x.state==='DONE').length}/${v.units.length} units integrated</span>
  <div class="seg">${['waves','kanban','timeline'].map(n=>`<button data-view="${n}" class="${VIEW===n?'on':''}">${n}</button>`).join('')}</div></div>
  ${VIEW==='waves'?wavesView(v):VIEW==='kanban'?boardView(v):timelineView(v)}</section>`}
function inspector(v){const x=v.units.find(x=>x.u.id===SEL);if(!x)return `<div class="empty">Pick any unit to see what it is doing, why, and its proof. The walk runs both ways: dream → feature → requirement → check → unit → commit → result.</div>`;
 const u=x.u,rs=u.reqs.map(req),fs=[...new Set(rs.flatMap(r=>r.f))],cs=DS.checks.filter(c=>c.unit===u.id);
 const runs=cs.flatMap(c=>c.runs.filter(r=>r[0]<=T).map(r=>[c.id,...r]));const red=runs.some(r=>r[2]==='base'&&r[4]===1),green=runs.some(r=>r[2]==='patch'&&r[4]===0);
 const jv=DS.verdicts.find(j=>j.kind==='unit'&&j.subject===u.id&&j.t<=T);
 return `<div class="card insp"><div class="bead-h"><span class="${CLS(x.state)}">${G[x.state]}</span><span class="uid">${u.id}</span><span class="ut">${u.title}</span><span class="sp"></span><span class="st ${CLS(x.state)}">${x.state}</span><span class="tm">${fmt(T-x.since)}</span></div>
  <div class="kv"><b>What</b><span>Owns <span class="mono">${u.scope.join(', ')}</span></span>
  <b>Why</b><span>${rs.length?rs.map(r=>`${r.id} ${r.title}`).join('; '):'Seldon unit: the try-it guide (C8)'}</span>
  <b>Needs</b><span>${u.deps.length?'after '+u.deps.join(', '):'no dependencies'}${u.consumes.length?' · consumes '+u.consumes.join(', '):''}${u.provides.length?' · provides '+u.provides.join(', '):''}</span>
  <b>Now</b><span>${x.reason||DOING[x.state]||'Integrated at '+u.commit+'.'}${x.att>1?` Attempt ${x.att}.`:''}</span>
  <b>Proof</b><span>${cs.length?cs.map(c=>c.id).join(', ')+' · '+(red&&green?'<span class="c-ok">failed on base, passes on patch</span>':'not run yet'):'guide check runs at wave-verify'}${jv?` · judge: <span class="c-ok">${jv.v}</span>`:x.state==='JUDGING'?' · judge: asked':''}</span>
  <b>Who</b><span class="mono dim">${u.worker} · ${DS.run.providers}</span></div>
  <div class="walk">${DS.run.dream} → ${fs.join(' ')||'—'} → <b>${u.reqs.join(' ')||'—'}</b> → ${cs.map(c=>c.id).join(' ')||'—'} → <b>${u.id}</b> → ${x.state==='DONE'?u.commit:'<span class="faint">no commit yet</span>'} → ${x.state==='DONE'?'<span class="c-ok">integrated</span>':'<span class="faint">'+x.state.toLowerCase()+'</span>'}
   <div class="faint">In chat: “inspect ${u.id}”</div></div></div>`}
function trace(v){const tree=DS.features.map(f=>{const rs=DS.reqs.filter(r=>r.f.includes(f.id));const fv=f.verdict&&f.verdict[0]<=T;
  return `<details ${rs.some(r=>unit(SEL)&&unit(SEL).reqs.includes(r.id))||DS.features.length<3?'open':''}><summary><span class="k">feat</span><span class="t"><b>${f.title}</b> <span class="faint mono">${f.id}</span></span><span class="es ${fv?'c-ok':'c-dim'}">${fv?'satisfied':rs.length?'not judged':'not planned'}</span></summary>
   <div class="dim" style="font-size:12px;margin:0 0 4px 34px">${f.text}</div>
   ${rs.map(r=>{const [es,ec]=evState(r,v);const hit=unit(SEL)&&unit(SEL).reqs.includes(r.id);const cs=DS.checks.filter(c=>c.req===r.id);
    return `<details class="${hit?'hit':''}" ${hit?'open':''}><summary><span class="k">req</span><span class="t">${r.title} <span class="faint mono">${r.id}</span></span><span class="es ${ec}">${es}</span></summary>
     ${cs.map(c=>{const rn=c.runs.filter(x=>x[0]<=T);const u=v.units.find(x=>x.u.id===c.unit);
      return `<div class="leaf"><span class="k lbl">check</span><span>${c.id}</span><span class="faint">${c.cmd} · ${c.level} · ${c.mode}</span>
       <span>${rn.length?rn.map(x=>`<span class="${x[3]?'c-bad':'c-ok'}" title="${x[1]} run, exit ${x[3]}, ${x[4]}s">${x[3]?'RED':'GREEN'}@${x[2]}</span>`).join(' → '):'<span class="faint">not run</span>'}</span></div>
       <div class="leaf"><span class="k lbl">unit</span><button data-u="${c.unit}" class="uid ${u?CLS(u.state):''}" style="text-decoration:underline dotted">${c.unit}</button><span>${u?u.state:'planned'}</span><span class="faint">${u&&u.state==='DONE'?'commit '+u.u.commit+' · integrated':''}</span></div>`}).join('')}
    </details>`}).join('')||''}</details>`}).join('');
 const cov=DS.reqs.map(r=>evState(r,v)[0]);const n=s=>cov.filter(c=>c===s).length;
 return `<section id="trace"><div class="sh"><h2>Trace</h2><span class="n">${DS.reqs.length} requirements · ${n('validated live')} validated live · ${n('integrated')} integrated · ${n('awaiting')} awaiting${n('failed')?' · '+n('failed')+' failed':''}${n('stale')?' · '+n('stale')+' stale':''}</span></div>
  ${inspector(v)}<div class="tree">${v.units.length||DS.run.illustrative?tree:'<div class="empty">The trace appears with the plan.</div>'}</div></section>`}
function evidence(v){const shots=DS.shots.filter(s=>s.t<=T),ver=DS.verdicts.filter(j=>j.t<=T);
 const runs=DS.checks.flatMap(c=>c.runs.filter(r=>r[0]<=T).map(r=>[c,...r])).sort((a,b)=>b[1]-a[1]);
 const flow=ver.filter(j=>j.kind==='flow'),uj=ver.filter(j=>j.kind==='unit');
 const vd=j=>`<div class="card verd"><span class="es c-ok">${j.v}</span> <b>${j.subject}</b> <span class="faint mono">${fmt(j.t)}</span><div class="why">${j.why}</div></div>`;
 return `<section id="evidence"><div class="sh"><h2>Evidence</h2><span class="n">${shots.length?DS.shotTotal+' screenshots · ':''}${runs.length} check runs · ${ver.length} verdicts</span></div>
  ${shots.length?`<div class="shots">${shots.map(s=>`<figure class="shot" data-img="${s.img}"><img src="${IMG[s.img]}" alt="${s.title}"><figcaption><b>${s.title}</b>${s.cap} · ${s.commit}</figcaption></figure>`).join('')}</div><div class="faint" style="font-size:11.5px;margin-top:4px">3 of ${DS.shotTotal} shown. Real browser run in Edge on the actual page.</div>`:`<div class="empty">${DS.run.illustrative?'Illustrative sample: screenshots from each real-path check appear here.':'Screenshots appear when a unit with a visible surface is proven.'}</div>`}
  <div class="sub">Flow verdicts${DS.run.m1?' <span style="text-transform:none;letter-spacing:0">(M1: feature judgment on the integrated page stands in)</span>':''}</div>
  ${flow.map(vd).join('')||'<div class="empty">A judge traces each user flow across the contracts it crosses, after wave-verify.</div>'}
  <div class="sub">Unit judgments</div>${uj.slice().reverse().map(vd).join('')||'<div class="empty">None yet.</div>'}
  <div class="sub">Check runs, newest first</div>
  ${runs.length?`<table class="runs">${runs.slice(0,10).map(([c,t,p,commit,exit,secs])=>`<tr><td>${fmt(t)}</td><td>${c.id}</td><td class="${exit?'c-bad':'c-ok'}">${exit?'RED':'GREEN'}</td><td>${p}@${commit}</td><td>exit ${exit} · ${secs}s · ${c.cmd}${exit&&p==='base'?' · expected: must fail before the work':''}</td></tr>`).join('')}</table>`:'<div class="empty">No check has run yet.</div>'}
 </section>`}
function plan(v){const vi=DS.vision,locked=T>=DS.segs.find(s=>s[0]==='A')[1];
 return `<section id="plan"><div class="sh"><h2>Plan</h2><span class="n">Vision Lock · ${DS.areas.length} area${DS.areas.length>1?'s':''} · ${DS.contracts.length} contracts · ${DS.decisions.filter(d=>d[0]<=T).length} decisions</span></div><div class="cols">
  <div><div class="card vision"><span class="lbl">Vision Lock${locked?'':' (proposed)'} · size ${DS.run.size} · ${DS.run.sizeNote}</span><div style="margin:4px 0 8px">${DS.run.understanding}</div>
   <span class="lbl">Seldon's improvements</span><ul>${vi.improve.map(x=>`<li>${x}</li>`).join('')}</ul>
   <span class="lbl">In</span><ul>${vi.scopeIn.map(x=>`<li>${x}</li>`).join('')}</ul><span class="lbl">Out</span><ul>${vi.scopeOut.map(x=>`<li>${x}</li>`).join('')}</ul>
   <span class="lbl">Quality bar</span>${vi.quality.map(([q,t],i)=>`<div class="q"><span class="mono faint">${i+1}</span><span>${q}</span><span class="es ${t<=T?'c-ok':'c-dim'}">${t<=T?'satisfied':'not judged'}</span></div>`).join('')}</div></div>
  <div><div class="sub" style="margin-top:14px">Contracts${DS.run.m1?' <span style="text-transform:none;letter-spacing:0">(M1: text lives on the requirement)</span>':''}</div>
   ${DS.contracts.map(c=>`<div class="card con"><b>${c.name}</b> <span class="faint mono">${c.id}</span>${c.stale&&c.stale<=T?' <span class="es c-rw">being corrected</span>':''}<div class="flow"><span class="c-live">▲ ${c.provider}</span> → ▽ ${c.consumers.join(' ')}</div><div class="dim" style="margin-top:3px">${c.text}</div></div>`).join('')}</div>
  <div><div class="sub" style="margin-top:14px">Decisions and discoveries</div>
   ${DS.decisions.filter(d=>d[0]<=T).reverse().map(d=>`<div class="dec"><time>${fmt(d[0])}</time><div><span class="lbl">${d[1]}</span> <b>${d[2]}</b><div class="why">${d[3]}</div></div></div>`).join('')||'<div class="empty">None yet.</div>'}</div>
 </div></section>`}
function openS(v){const calls=(at(DS.cost.calls.map(c=>[c[1],c[0]]),T)||[0])[0];
 return `<section id="open"><div class="sh"><h2>Not judged</h2><span class="n">${v.open.length} item${v.open.length===1?'':'s'}: neither passed nor failed</span></div>
  ${v.open.map(o=>`<div class="card open"><b>${o[2]}</b><div class="why">${o[3]}</div></div>`).join('')||'<div class="empty">Everything reached so far has a verdict.</div>'}</section>
  <div class="foot"><b>So far</b> ${fmt(T)} elapsed · ${calls} provider calls · ${v.units.reduce((a,x)=>a+x.att-1,0)} reworks · ${v.units.filter(x=>x.state==='DONE').length} units integrated<br>
  <b>Run</b> ${DS.run.id} · ${DS.run.providers}<br>${DS.run.illustrative?'<b>Illustrative sample, not a real run.</b><br>':''}Read-only. Everything is decided and controlled in chat.</div>`}
function render(){const v=V(),p=$('#page'),y=p.scrollTop;
 p.innerHTML=header(v)+`<main>${now(v)}${waves(v)}${trace(v)}${evidence(v)}${plan(v)}${openS(v)}</main>`;p.scrollTop=y;
 $('#mkT').value=T;$('#mkTl').textContent=fmt(T)+' / '+fmt(DS.run.end);$('#url').textContent=`127.0.0.1:${DS.run.port}/${SEL?'#'+SEL:''}   (static files; reloads state.js every 2 s)`}

/* ============================================================ interactions: navigation only, nothing here changes a run ============================================================ */
function go(id){const el=$('#page #'+id);if(el)$('#page').scrollTo({top:el.offsetTop-($('#page .hd').offsetHeight+4),behavior:'smooth'})}
$('#page').addEventListener('click',e=>{const b=e.target.closest('[data-u],[data-view],[data-col],[data-img],#seen,#expand,.tabs a');if(!b)return;
 if(b.matches('.tabs a')){e.preventDefault();return go(b.getAttribute('href').slice(1))}
 if(b.id==='seen'){e.preventDefault();LASTSEEN=T;return render()}
 if(b.id==='expand')return toggleFull();
 if(b.dataset.view){VIEW=b.dataset.view;return render()}
 if(b.dataset.col){const c=$('#page .board').children[b.dataset.col];return $('#page .board').scrollTo({left:c.offsetLeft-$('#page .board').offsetLeft,behavior:'smooth'})}
 if(b.dataset.img){$('#lb img').src=IMG[b.dataset.img];return $('#lb').classList.add('on')}
 if(b.dataset.u){SEL=SEL===b.dataset.u&&!b.closest('#now')?null:b.dataset.u;render();if($('#page').clientWidth<980&&SEL&&!b.closest('#trace'))go('trace')}});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
function toggleFull(){$('#stage').classList.toggle('full');$('#mkFull').classList.toggle('on')}
$('#mkFull').onclick=toggleFull;
$('#mkChat').onclick=()=>{$('#stage').classList.toggle('chat');$('#stage').classList.remove('full')};
$('#mkTheme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
$('#mkT').oninput=e=>{T=+e.target.value;render()};
$('#mkPlay').onclick=()=>{if(playing){clearInterval(playing);playing=null}else{if(T>=DS.run.end)T=0;playing=setInterval(()=>{T=Math.min(DS.run.end,T+6);render();if(T>=DS.run.end){clearInterval(playing);playing=null;$('#mkPlay').textContent='play'}},200)}$('#mkPlay').textContent=playing?'pause':'play'};
document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{DS=b.dataset.ds==='foundation'?FOUNDATION:SHELF;T=DS.run.start||1055;LASTSEEN=T-900;SEL=null;
 document.querySelectorAll('[data-ds]').forEach(x=>x.classList.toggle('on',x===b));$('#mkT').max=DS.run.end;render()});

let CI=0;
function chat(){$('#chatTabs').innerHTML=CHAT.map((c,i)=>`<button class="${i===CI?'on':''}" data-ci="${i}">${c.n}</button>`).join('');
 $('#term').innerHTML=CHAT[CI].x;$('#chatNote').innerHTML=CHAT[CI].note+'<br><br>Text is Foundation run 59d3a56-c02 at the moment shown. Selecting a sample moves the page to that moment; the link opens the page at the right place.'}
$('#chatTabs').onclick=e=>{const b=e.target.closest('[data-ci]');if(!b)return;CI=+b.dataset.ci;if(DS!==FOUNDATION)document.querySelector('[data-ds=foundation]').click();T=CHAT[CI].t;LASTSEEN=Math.max(0,T-180);chat();render()};
$('#term').onclick=e=>{const a=e.target.closest('[data-go]');if(!a)return;const g=a.dataset.go;if(unit(g)){SEL=g;render();go('trace')}else go(g)};
